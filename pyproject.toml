[project]
name = "reroll-data"
version = "0.1.0"
description = "Static pypi data for determining reroll compatibility percentages with real packages"
readme = "README.md"
authors = [
    { name = "Anil Kulkarni", email = "akulkarni@anaconda.com" }
]
requires-python = ">=3.13"
dependencies = [
    "pypi-simple>=1.8",
    # Imported directly (crawl.py, metadata.py) rather than only reached through
    # pypi-simple, so declared here instead of relied on transitively.
    "requests>=2.32",
    "urllib3>=2.0",
    # The thing under test, and now a required dependency (not gated behind an
    # optional group) -- reroll_data.metadata/backfill/retry_metadata_conversion/
    # reroll_convert/reroll_index_demo all import it unconditionally. Pinned to
    # the published PyPI release (distribution name `py-reroll`; the importable
    # module stays `reroll`) rather than a local editable checkout -- reroll is
    # stable enough now that this repo tracks its released versions instead of
    # an in-progress ../reroll working tree. Bump this alongside a
    # `uv lock --upgrade-package py-reroll` when a new release is needed.
    "py-reroll>=0.4.0",
]

[project.scripts]
reroll-data = "reroll_data.cli:main"
reroll-investigate = "reroll_data.investigate:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

# --------------------------------------------------------------------------- #
# conda-pypi comparison environment (see reroll_data.repodata_convert)
# --------------------------------------------------------------------------- #
# `conda_pypi` is a conda *package* (a conda plugin, published on
# conda-forge): it needs the real `conda` package, which is not pip-installable
# and therefore cannot live in the ordinary uv venv this file otherwise
# describes (`[project.dependencies]`, `[build-system]` above). `pixi` builds
# a *second*, conda-based environment (in `.pixi/`, alongside `.venv/`) for
# exactly one job: running `reroll-data repodata convert`. It mirrors how
# conda-pypi's own `pyproject.toml` mixes a normal build backend (there:
# hatchling; here: uv_build) with `[tool.pixi.*]` tables in the same file --
# one file, two independently-managed environments.
#
# That environment gets:
#   - `conda-pypi` itself (which pulls in real `conda` transitively), from
#     conda-forge -- an ordinary conda dependency, not a local checkout: the
#     APIs `conda_pypi_index_demo.py` needs (`package_metadata_from_metadata_body`,
#     `pypi_to_repodata`) are already in the published 0.11.0 release;
#   - this project, editable, so the ordinary `reroll-data` console script
#     (and therefore `reroll-data repodata convert`, and running
#     `conda_pypi_index_demo.py` directly -- see that module's docstring) is
#     directly runnable from inside it -- no separate entry point to
#     maintain;
#   - `reroll`, pinned to the same published PyPI release as the ordinary uv
#     env above (`[project.dependencies]`) -- needed transitively because
#     `reroll_data.cli` imports every subcommand module up front, including
#     ones (`metadata.py`, `backfill.py`) that import `reroll` unconditionally
#     now that it is a required dependency. Distribution name `py-reroll`; the
#     importable module stays `reroll`.
#
# Reused, never recreated: `pixi install` (or the first `pixi run`) solves and
# builds this once; every later `pixi run` (including via `make
# repodata-convert`, see the `Makefile`) just verifies the lockfile still
# matches and reuses it -- cheap, and it only actually resolves/reinstalls
# again if these `[tool.pixi.*]` tables change.
[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64", "linux-aarch64"]

[tool.pixi.dependencies]
# Pinned to match this project's own `requires-python` above (conda-pypi
# itself supports a wider 3.10-3.14 range) so both environments run the same
# interpreter version.
python = "3.13.*"
conda-pypi = ">=0.11.0"

[tool.pixi.pypi-dependencies]
reroll-data = { path = ".", editable = true }
py-reroll = ">=0.4.0"
